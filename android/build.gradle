buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.4.2'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.3'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

subprojects {
    def configureSubproject = { p ->
        if (p.hasProperty('android')) {
            try {
                if (p.android.namespace == null) {
                    p.android.namespace = "com.iraqinpt.plugins." + p.name.replace("-", "_")
                }
            } catch (Exception e) {}
            try {
                if (p.android.compileSdkVersion != null && p.android.compileSdkVersion.matches('\\d+') && Integer.parseInt(p.android.compileSdkVersion) < 34) {
                    p.android.compileSdkVersion = 34
                }
            } catch (Exception e) {}
        }
    }
    if (project.state.executed) {
        configureSubproject(project)
    } else {
        project.afterEvaluate { configureSubproject(project) }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}