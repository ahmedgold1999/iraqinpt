<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="description" content="تطبيق الاختبار الوطني الموحد">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="الاختبار الوطني">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>الاختبار الوطني الموحد</title>

  <style>
    body {
      background-color: #F8FAFC;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    .loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #F8FAFC;
      z-index: 9999;
      transition: opacity 0.25s ease-out;
    }

    .loading-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3.5px solid #E2E8F0;
      border-top-color: #2563EB;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    .title {
      margin-top: 18px;
      font-size: 16px;
      font-weight: 700;
      color: #0F172A;
    }

    .status {
      margin-top: 6px;
      font-size: 12.5px;
      color: #64748B;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-indicator" class="loading-container">
    <div class="loading-card">
      <div class="spinner"></div>
      <div class="title">الاختبار الوطني الموحد</div>
      <div class="status" id="loadingText">جاري التحميل...</div>
    </div>
  </div>

  <script>
    function removeLoader() {
      const loader = document.getElementById('loading-indicator');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 200);
      }
    }

    // إخفاء التحميل بشكل سريع وآمن
    setTimeout(removeLoader, 4000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
