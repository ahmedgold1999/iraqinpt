<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="تطبيق دليل الامتحان الوطني العراقي الموحد">
  <meta name="theme-color" content="#070B14">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="INPT IQ">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>دليل الامتحان الوطني العراقي</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #070B14;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease-out;
      z-index: 9999;
    }

    .loader-ring {
      width: 60px;
      height: 60px;
      border: 3.5px solid rgba(250, 204, 21, 0.15);
      border-top: 3.5px solid #FACC15;
      border-radius: 50%;
      animation: spin 1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
      box-shadow: 0 0 20px rgba(250, 204, 21, 0.2);
    }

    .loader-text {
      margin-top: 20px;
      font-size: 15px;
      font-weight: 700;
      color: #FACC15;
      letter-spacing: 0.5px;
      direction: rtl;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <script>
    // وظيفة إزالة اللودر بسلاسة عند جاهزية فلاتر
    window.removeLoader = function() {
      const loader = document.getElementById('loading-container');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => {
          if (loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 400);
      }
    };
  </script>
</head>
<body>
  <div id="loading-container">
    <div class="loader-ring"></div>
    <div class="loader-text">جاري تشغيل التطبيق...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
