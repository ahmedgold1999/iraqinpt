name: inpt
description: تطبيق الاختبارات الوطني الموحد. تطبيق تعليمي متكامل للاختبارات مع نظام اشتراكات متقدم.
publish_to: 'none'

version: 1.2.6+31

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # المحلية
  flutter_localizations:
    sdk: flutter

  firebase_core: ^3.15.2
  firebase_auth: ^5.5.1
  firebase_messaging: ^15.2.10
  cloud_firestore: ^5.6.5
  firebase_crashlytics: ^4.3.4
  flutter_tts: ^4.2.2
  flutter_local_notifications: ^18.0.1
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1
  http: ^1.1.0
  font_awesome_flutter: ^11.0.0
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.1.0
  flutter_spinkit: ^5.2.0
  shared_preferences: ^2.2.2
  animated_text_kit: ^4.2.2
  carousel_slider: ^5.1.1
  flutter_inappwebview: ^6.1.5
  webview_flutter: ^4.4.0
  webview_flutter_web: ^0.2.0  # ✅ أضفت هذه الحزمة
  package_info_plus: ^4.2.0
  intl: ^0.20.2
  url_launcher: ^6.3.1
  provider: ^6.1.1
  connectivity_plus: ^6.1.3
  permission_handler: ^11.4.0
  device_info_plus: ^11.3.3
  lottie: ^3.1.2
  share_plus: ^10.1.4
  path_provider: ^2.1.2
  flutter_pdfview: ^1.4.5
  audioplayers: ^6.1.0
  googleapis_auth: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  # flutter_native_splash: ^2.3.7

flutter:
  uses-material-design: true

  # الأصول
  assets:
    - assets/icons/loading_luxury.gif
    - assets/icons/mohesr.pdf
    - assets/fonts/
    - assets/icons/exam_schedule.png
    - assets/audio/

  # الخطوط المخصصة
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 700
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 700

# ⚠️ flutter_icons يجب أن تكون خارج flutter
flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  remove_alpha_ios: true