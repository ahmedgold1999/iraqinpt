name: inpt
description: تطبيق الاختبارات الوطني الموحد. تطبيق تعليمي متكامل للاختبارات مع نظام اشتراكات متقدم.
publish_to: 'none'

version: 2.1.2+41

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # المحلية
  flutter_localizations:
    sdk: flutter

  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_messaging: ^16.7.0
  cloud_firestore: ^6.10.0
  firebase_crashlytics: ^5.4.0
  flutter_tts: ^4.2.2
  flutter_local_notifications: ^22.3.1
  http: ^1.1.0
  font_awesome_flutter: ^11.0.0
  flutter_svg: ^2.0.10+1
  google_fonts: ^8.2.1
  flutter_spinkit: ^5.2.0
  shared_preferences: ^2.2.2
  animated_text_kit: ^4.2.2
  carousel_slider: ^5.1.1
  flutter_inappwebview: ^6.1.5
  webview_flutter: ^4.4.0
  webview_flutter_web: ^0.2.0  # ✅ أضفت هذه الحزمة
  package_info_plus: ^10.2.1
  intl: ^0.20.2
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  flutter_windowmanager:
    path: packages/flutter_windowmanager
  url_launcher: ^6.3.1
  provider: ^6.1.1
  connectivity_plus: ^7.3.1
  permission_handler: 11.3.1
  device_info_plus: ^13.2.0
  lottie: ^3.1.2
  share_plus: ^13.3.0
  path_provider: ^2.1.2
  flutter_pdfview: ^1.4.5
  audioplayers: ^6.1.0
  googleapis_auth: ^2.3.3
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.0
  confetti: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  # flutter_native_splash: ^2.3.7

flutter:
  uses-material-design: true

  # الأصول
  assets:
    - assets/icons/loading_luxury.gif
    - assets/icons/update_anim.gif
    - assets/icons/mohesr.pdf
    - assets/fonts/
    - assets/icons/exam_schedule.png
    - assets/icons/app_icon.png
    - assets/icons/winter.png
    - assets/icons/newyear.png
    - assets/icons/ramdan.png
    - assets/icons/iraq.png
    - assets/audio/

  # الخطوط المخصصة
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 700
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 700

# ⚠️ flutter_icons يجب أن تكون خارج flutter
flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  remove_alpha_ios: true